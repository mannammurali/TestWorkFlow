name: Auto Format SQL with SQLFluff

on:
  push:
    paths:
      - "**/*.sql"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SQLFluff
        run: |
          python3 -m pip install --upgrade pip
          pip install sqlfluff

      - name: Run SQLFluff to check for issues
        run: |
          sqlfluff fix --dialect tsql --verbose --force . || true  # Show detailed output of fixes

      - name: Check if any files changed
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=no" >> $GITHUB_OUTPUT
          else
            echo "changed=yes" >> $GITHUB_OUTPUT
          fi

      - name: Stop if no changes
        if: steps.changes.outputs.changed == 'no'
        run: echo "No formatting changes detected."

      - name: Create new branch for changes
        id: create_branch
        if: steps.changes.outputs.changed == 'yes'
        run: |
          BRANCH="sqlfluff-format-$(date +%s)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH"

      - name: Commit formatted SQL
        if: steps.changes.outputs.changed == 'yes'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-format SQL files (minimal formatting)"

      - name: Push new branch
        if: steps.changes.outputs.changed == 'yes'
        run: |
          git push --set-upstream origin ${{ steps.create_branch.outputs.branch }}

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'yes'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.create_branch.outputs.branch }}
          title: "Auto-format SQL files (minimal formatting)"
          body: "This PR applies minimal formatting to SQL files: indentation, comma placement, and join alignment."
          base: main

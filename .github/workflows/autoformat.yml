name: Lint SQL

on:
  push:
    branches: [ main ]

jobs:
  sqlfluff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"
        
      - name: Install and configure SQLFluff
        run: pip install sqlfluff
      
      - name: Run SQLFluff
        run: sqlfluff lint src/sql/

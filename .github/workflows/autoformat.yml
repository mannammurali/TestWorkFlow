name: SQL Formatting (Teradata)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  format-teradata-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: Format Teradata SQL files
        run: sqlfluff fix --dialect teradata .

      - name: Check for changes after formatting
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Teradata SQL files were reformatted."
            exit 1
          fi

